services:
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
  api:
    build: ./apps/api
    env_file: .env
    environment:
      DIAS_DATABASE_PATH: /data/incidents.sqlite3
      DIAS_STORAGE_PATH: /data/uploads
    volumes: ["dias_data:/data"]
    ports: ["8000:8000"]
volumes:
  dias_data:
